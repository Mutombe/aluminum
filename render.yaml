services:
  - type: web
    name: aluminum
    runtime: static
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback — any path that isn't a real file serves index.html.
    # This also stops missing/stale asset requests from hard-404ing.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # index.html must never be cached, so the browser always gets the
      # build that references the current (hashed) asset filenames.
      - path: /index.html
        name: Cache-Control
        value: no-cache
      # Hashed assets are content-addressed and safe to cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
